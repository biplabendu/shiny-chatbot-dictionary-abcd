name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main
  # Allows you to manually trigger the deploy from the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Skip the project .Rprofile for every Rscript call in this job
      # (including those spawned inside deploy.sh). Its renv activation is
      # meant for local dev only -- on the runner it would (a) crash at
      # startup calling an unqualified install.packages("renv") before utils
      # is attached, and (b) repoint .libPaths() at the gitignored project
      # library, hiding the rsconnect we install into R_LIBS_USER. renv
      # restore happens server-side on shinyapps.io from renv.lock.
      R_PROFILE_USER: /dev/null
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'

      # renv::restore installs ~60 packages as PPM binaries but builds the few
      # whose lockfile version differs from PPM-latest from source; of those,
      # openssl needs libssl headers (the rest need only the compiler toolchain
      # that the runner already has). libcurl is cheap insurance for the HTTP
      # stack. Runtime .so's for the binary packages are already on the image.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # deploy.sh hardcodes python_env/bin/python as the interpreter for
      # rsconnect::deployApp(). This venv is gitignored (build output), so it
      # must exist before deploy.sh runs. We only install the runtime deps
      # from requirements.txt here -- the model + embeddings are already
      # committed build artifacts (see python/model/, data/embeddings/) and
      # are not rebuilt in CI.
      - name: Create python_env
        run: |
          python -m venv python_env
          python_env/bin/python -m pip install --upgrade pip
          python_env/bin/python -m pip install -r requirements.txt

      # Install renv from the RSPM binary repo (RSPM env, set by setup-r) so
      # renv::restore is available. rsconnect itself is NOT installed here --
      # it is in renv.lock (1.8.0) and gets installed by the restore step
      # below, at the exact version the lockfile pins.
      - name: Install renv
        run: |
          Rscript -e '
            repo <- Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest")
            utils::install.packages("renv", repos = repo)
            if (!requireNamespace("renv", quietly = TRUE)) stop("renv failed to install")
          '

      # rsconnect::deployApp captures dependencies from renv.lock and aborts
      # unless every lockfile package is installed locally at the SAME version
      # (it reads each package's DESCRIPTION; a missing one made parseRenv-
      # Dependencies die with "subscript out of bounds"). Restore the exact
      # lockfile versions into .libPaths()[1] (= R_LIBS_USER) -- the library
      # the deploy step's Rscript sees, since renv activation is disabled in
      # this job. This also installs rsconnect (1.8.0) and all app packages.
      - name: Restore R packages from renv.lock
        run: Rscript -e 'renv::restore(lockfile = "renv.lock", library = .libPaths()[1], prompt = FALSE)'

      - name: Configure shinyapps.io account
        run: |
          Rscript -e "rsconnect::setAccountInfo(name='${{ secrets.SHINYAPPS_ACCOUNT }}', token='${{ secrets.SHINYAPPS_TOKEN }}', secret='${{ secrets.SHINYAPPS_SECRET }}')"

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
        run: ./deploy.sh
