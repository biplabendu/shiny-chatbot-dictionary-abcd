name: Deploy to shinyapps.io

on:
  push:
    branches:
      - main
  # Allows you to manually trigger the deploy from the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Skip the project .Rprofile for every Rscript call in this job
      # (including those spawned inside deploy.sh). Its renv activation is
      # meant for local dev only -- on the runner it would (a) crash at
      # startup calling an unqualified install.packages("renv") before utils
      # is attached, and (b) repoint .libPaths() at the gitignored project
      # library, hiding the rsconnect we install into R_LIBS_USER. renv
      # restore happens server-side on shinyapps.io from renv.lock.
      R_PROFILE_USER: /dev/null
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # deploy.sh hardcodes python_env/bin/python as the interpreter for
      # rsconnect::deployApp(). This venv is gitignored (build output), so it
      # must exist before deploy.sh runs. We only install the runtime deps
      # from requirements.txt here -- the model + embeddings are already
      # committed build artifacts (see python/model/, data/embeddings/) and
      # are not rebuilt in CI.
      - name: Create python_env
        run: |
          python -m venv python_env
          python_env/bin/python -m pip install --upgrade pip
          python_env/bin/python -m pip install -r requirements.txt

      # Install from the RSPM binary repo (RSPM env, set by setup-r), not
      # source cloud CRAN: the source build needs rsconnect's openssl/curl
      # deps to compile, and install.packages only WARNS on failure -- which
      # is how a missing rsconnect slipped through to setAccountInfo. Verify
      # it loaded so a failed install stops the job here, loudly.
      - name: Install rsconnect
        run: |
          Rscript -e '
            repo <- Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest")
            utils::install.packages("rsconnect", repos = repo)
            if (!requireNamespace("rsconnect", quietly = TRUE)) stop("rsconnect failed to install")
          '

      - name: Configure shinyapps.io account
        run: |
          Rscript -e "rsconnect::setAccountInfo(name='${{ secrets.SHINYAPPS_ACCOUNT }}', token='${{ secrets.SHINYAPPS_TOKEN }}', secret='${{ secrets.SHINYAPPS_SECRET }}')"

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
        run: ./deploy.sh
